# ---------------------------------------------------------------------------
# A home server, in one command.
#
#   cp .env.example .env      # then edit it — it has no usable defaults
#   docker compose up -d
#
# Self-hosting is a core requirement, not a nicety (docs/architecture/03 §1):
# anyone can run a server, and the operator controls who joins. That is also
# why adversarial servers exist by design, and why the federation layer has to
# make cheating not work without any central authority.
#
# ⚠ There is NO database service. As of 2026-08-02 the server embeds H2 and
# writes to a file under the `gamedata` volume, so a self-hoster needs a JVM and
# nothing else. The old `db` service, its healthcheck and its POSTGRES_* settings
# are gone; `.env.example` no longer needs credentials for them.
#
# NOT YET VERIFIED after the H2 migration: neither this compose file nor the
# image build has been exercised since the database was removed. The previous
# note recorded a real round-trip test of the Postgres volume; that test no
# longer describes this file.
# ---------------------------------------------------------------------------
name: eyeandsickle

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # H2, embedded and file-backed, under the mounted volume. There is no
      # database service any more — the server IS the database (2026-08-02).
      EYEANDSICKLE_DB_URL: "jdbc:h2:file:/data/eyeandsickle;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE"
      EYEANDSICKLE_PORT: 8080
      # Minecraft-style allowlist. Empty means nobody joins — closed by default
      # is the right default for a server that holds real losable player state.
      EYEANDSICKLE_ALLOWLIST_DIDS: ${EYEANDSICKLE_ALLOWLIST_DIDS:-}
      # Opt-in (docs/architecture/03 §2). Leave false for a solo or friends
      # server: no directory listing, no validator duty, no cross-server play.
      # Set the profile too, so the federation migrations actually run.
      EYEANDSICKLE_FEDERATION_ENABLED: ${EYEANDSICKLE_FEDERATION_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "${EYEANDSICKLE_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    # ⚠ The game state lives here and NOWHERE else. Losing this volume is
    # losing every character on the server; there is no second copy and no
    # database service holding one. Back it up like a save file, because that
    # is now exactly what it is.
    volumes:
      - gamedata:/data

volumes:
  gamedata:
