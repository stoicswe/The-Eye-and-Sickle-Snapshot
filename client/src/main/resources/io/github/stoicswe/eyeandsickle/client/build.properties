# Written by Maven at build time — see client/pom.xml's <resources> block.
#
# ⚠ This is the ONLY file in client resources that is filtered. Everything else beside it is
# binary (the two TTFs, the mascot) or contains ${...} of its own (the term pages), and running
# the filter over those corrupts them silently.
#
# `version` is ${client.version}, which defaults to the POM version and can be overridden at
# build time (-Dclient.version=0.2.0). It exists because a release is named after its git tag
# while the POM stays on whatever it was — see .github/workflows/build.yml.
version=${client.version}

# The Discord application id, from https://discord.com/developers — see
# client/presence/RichPresence. Public, not a secret: it is how Discord identifies the game.
#
# BLANK IS THE SUPPORTED DEFAULT. With no id the rich-presence setting is disabled and says so, so a
# fork and a local build both work with nothing configured. Set it for a real build with
# -Ddiscord.app.id=… or by filling in <discord.app.id> in client/pom.xml.
discordAppId=${discord.app.id}
