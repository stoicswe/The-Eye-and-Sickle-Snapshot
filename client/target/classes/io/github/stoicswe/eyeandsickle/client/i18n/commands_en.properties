# The shell's option and argument descriptions.
#
# ⚠ THIS FILE IS PROSE. The structure lives in Java.
#
# A key here describes an option; it never names one. Flag names, choice values and command names
# are declared in CommandSpec and are NEVER translated — `--thorough` is `--thorough` in every
# locale, because the parser has no other name for it, because real Unix does not localise flags,
# and because pillar C6 sells skill that transfers to a real terminal. Translating a flag would
# take that away from exactly the players a translation exists to serve.
#
# ⚠ A translation is a COPY of this file named commands_<lang>.properties, in this directory.
# It may be partial: Messages loads English first and writes the translation over it, so a key
# nobody has reached keeps its English text rather than disappearing. A key left BLANK is treated
# as "not done yet" and keeps English too — so delete a line rather than emptying it if you mean
# to fall back deliberately.
#
# ⚠ Encoding is UTF-8, not ISO-8859-1. Messages reads it through an explicit UTF-8 reader for
# that reason; do not "fix" an accented character by escaping it.

# -------------------------------------------------------------------------- filters
cmd.grep.i = Match without regard to case.
cmd.grep.v = Keep the lines that do NOT match.
cmd.grep.arg.pattern = What to look for.
cmd.sort.r = Reverse the order.
cmd.uniq.c = Count each run instead of just collapsing it.
cmd.head.n = How many lines to keep.
cmd.tail.n = How many lines to keep.
cmd.cut.f = Which columns to keep, 1-based.

# -------------------------------------------------------------------------- reads
cmd.ls.arg.path = Where to list. Defaults to the root.
cmd.log.p = Show this severity and above.
cmd.verify.arg.item = The item whose provenance chain to check.

# -------------------------------------------------------------------------- the rig
cmd.scan.thorough = A deeper sweep. Takes longer and finds more.
cmd.scan.full = The deepest sweep there is. Slowest, and misses least.
cmd.mine.pool = Mine into this pool instead of alone.
cmd.mine.solo = Mine alone. No pool fee, no smoothing.
cmd.mine.allocate = How many cycles to hold for mining.
cmd.mv.arg.item = The item to move.
cmd.mv.arg.tier = Where to move it: vault, standard or high.

# -------------------------------------------------------------------------- money
cmd.send.fee = What to pay for a place in an earlier block.
cmd.send.arg.address = Who to pay.
cmd.send.arg.amount = How much, in EC.

# -------------------------------------------------------------------------- the calculator
cmd.calc.bits = Word size to evaluate in.
cmd.calc.signed = Read the word as two's complement rather than unsigned.

# -------------------------------------------------------------------------- the network
cmd.net.docs = The story fragments recovered so far. Name one to read it.
cmd.sweep.wide = Reach further. Costs more cycles and makes more noise.
cmd.sweep.deep = Reach furthest, and look hardest. The loudest sweep.
cmd.file.out = Take the machine out of whatever folder it is in.
cmd.file.arg.address = The machine to file.
cmd.file.arg.folder = The folder to file it under.
cmd.mkdir.arg.path = The folder to make. Use parent/child to nest it.
cmd.mvdir.name = Rename the folder rather than moving it.
cmd.mvdir.arg.path = The folder to move.
cmd.mvdir.arg.new-parent = Where to move it to.
cmd.rmdir.arg.path = The folder to remove.

# -------------------------------------------------------------------------- the breach
cmd.breach.arg.target = Which target to open. `targets` lists the ids.
cmd.probe.arg.action = Which move to make. `probe` alone lists the legal ones.
cmd.probe.arg.argument = What that move needs, if it needs anything.

# -------------------------------------------------------------------------- the deck
cmd.theme.list = List the palettes instead of changing to one.
cmd.theme.arg.name = The palette to change to.
cmd.teach.level = How much the teaching layer explains.
cmd.teach.reset = Forget every term already marked as seen.
cmd.teach.arg.level = How much the teaching layer explains.
cmd.crt.arg.setting = Which screen artefact to set.
cmd.crt.arg.value = What to set it to.
cmd.hostname.arg.name = The new hostname. Leave it off to print the current one.
cmd.wallpaper.arg.mode = What the desk backdrop does. `wallpaper` with no argument lists them.
cmd.window.arg.name = Which window to act on.

# -------------------------------------------------------------------------- menu headings
# ⚠ These label the drill-down categories in the terminal's right-click menu. The commands
# inside them keep their real names in every locale; only the drawer is translated.
cmd.cat.rig = The rig
cmd.cat.files = Files and storage
cmd.cat.network = The network
cmd.cat.breach = Breaching
cmd.cat.economy = Ethecoin
cmd.cat.text = Text handling
cmd.cat.desk = The desk
cmd.cat.shell = The shell

# -------------------------------------------------------------------------- universal flags
# Every command has these; Command.flagNames is where they are promised.
cmd.universal.explain = Say what it would do, without doing it.
cmd.universal.dry-run = Go through the motions and change nothing.
cmd.universal.verbose = More detail in the output.
